<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- A raised minesweeper cell in the game's exact palette (silver face,
       light top/left bevel, dark bottom/right) carrying a blocky E in a
       light, confident blue. -->
  <rect width="16" height="16" fill="#c0c0c0"/>
  <rect width="16" height="2" fill="#ffffff"/>
  <rect width="2" height="16" fill="#ffffff"/>
  <rect y="14" width="16" height="2" fill="#808080"/>
  <rect x="14" width="2" height="16" fill="#808080"/>
  <g fill="#5b9bd5">
    <rect x="4.5" y="3.5" width="2" height="9"/>
    <rect x="4.5" y="3.5" width="7" height="2"/>
    <rect x="4.5" y="7" width="6" height="2"/>
    <rect x="4.5" y="10.5" width="7" height="2"/>
  </g>
</svg>
