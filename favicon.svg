<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- A raised minesweeper cell in the game's exact palette (silver face,
       light top/left bevel, dark bottom/right) carrying a blocky M in the
       board's strong classic blue (the "1" color). -->
  <rect width="16" height="16" fill="#c0c0c0"/>
  <rect width="16" height="2" fill="#ffffff"/>
  <rect width="2" height="16" fill="#ffffff"/>
  <rect y="14" width="16" height="2" fill="#808080"/>
  <rect x="14" width="2" height="16" fill="#808080"/>
  <g fill="#0000ff">
    <rect x="3.5" y="3.5" width="2" height="9"/>
    <rect x="10.5" y="3.5" width="2" height="9"/>
    <rect x="5.5" y="4.5" width="1.5" height="2.5"/>
    <rect x="9" y="4.5" width="1.5" height="2.5"/>
    <rect x="7" y="6" width="2" height="2.5"/>
  </g>
</svg>
