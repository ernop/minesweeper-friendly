<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="pages-redirect.js?v=20260926-pages-redirect-2"></script>
<title>Minesweeper - Self-check</title>
<link rel="stylesheet" href="style.css?v=20260926-short-check">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="self-check-page">
<div id="self-check-titlebar">
  <span id="self-check-titlebar-name">minesweeper</span>
</div>
<main id="self-check-layout">
  <header id="self-check-header">
    <a class="return-to-game" href="index.html">&larr; return to game</a>
    <h1>Self-check</h1>
  </header>
  <p id="self-check-status" hidden></p>

  <section id="self-check-start" class="self-check-card" hidden>
    <h2>New check</h2>
    <fieldset id="self-check-test-choice">
      <legend>Alertness test</legend>
    </fieldset>
    <div class="self-check-actions">
      <button type="button" id="self-check-start-routine" title="A check at your usual time. Routine checks form your baseline.">Start routine check</button>
      <button type="button" id="self-check-start-extra" title="A check prompted by circumstances, such as feeling unusual. Kept apart from the routine baseline because the moment was chosen, not scheduled.">Start extra check</button>
    </div>
  </section>

  <section id="self-check-checkin" class="self-check-card" hidden>
    <h2 id="sleepiness-question"></h2>
    <div id="sleepiness-choices" role="radiogroup" aria-labelledby="sleepiness-question"></div>
    <label class="self-check-field">Sleep in the past 24 hours
      <input id="self-check-sleep-hours" type="number" min="0" max="24" step="0.25" inputmode="decimal"> hours
    </label>
    <label class="self-check-field">Note
      <input id="self-check-note" type="text" maxlength="500">
    </label>
    <p id="self-check-checkin-error" class="self-check-error" hidden></p>
    <div class="self-check-actions">
      <button type="button" id="self-check-checkin-continue" disabled>Continue</button>
      <button type="button" id="self-check-checkin-cancel">Cancel</button>
    </div>
  </section>

  <section id="self-check-instructions" class="self-check-card" hidden>
    <h2 id="vigilance-title"></h2>
    <p id="vigilance-text"></p>
    <div class="self-check-actions">
      <button type="button" id="vigilance-begin">Begin</button>
      <button type="button" id="vigilance-cancel">Cancel</button>
    </div>
  </section>

  <section id="self-check-test" hidden>
    <div id="vigilance-box"><span id="vigilance-counter"></span></div>
  </section>

  <section id="self-check-result" class="self-check-card" hidden>
    <h2 id="self-check-result-heading"></h2>
    <p id="self-check-result-note" hidden></p>
    <table id="self-check-result-table" class="self-check-table" hidden></table>
  </section>

  <section id="self-check-history" class="self-check-card" hidden>
    <h2>History</h2>
    <p id="self-check-history-count"></p>
    <div class="self-check-table-scroll">
      <table id="self-check-history-table" class="self-check-table"></table>
    </div>
  </section>

  <section id="self-check-transfer" class="self-check-card" hidden>
    <h2>Backup</h2>
    <div class="self-check-actions">
      <button type="button" id="self-check-export">Export self-checks</button>
      <a id="self-check-download" hidden>Save self-check file</a>
      <label class="self-check-file">Import self-check file
        <input id="self-check-import" type="file" accept=".json,application/json">
      </label>
    </div>
    <p id="self-check-transfer-status" hidden></p>
    <p id="self-check-archive-status"></p>
    <div class="self-check-actions">
      <button type="button" id="self-check-archive-now" hidden></button>
    </div>
  </section>
</main>
<script src="storage.js?v=20260926-lifelong"></script>
<script src="observation-context.js?v=20260926-lifelong"></script>
<script src="archive.js?v=20260926-lifelong"></script>
<script src="self-check-core.js?v=20260926-short-check"></script>
<script src="self-check-page.js?v=20260926-short-check"></script>
</body>
</html>
