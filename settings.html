<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minesweeper - Settings</title>
<link rel="stylesheet" href="style.css?v=20260921-middle-rank">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body class="settings-page">
<div id="settings-titlebar">
  <span id="settings-titlebar-name">minesweeper</span>
</div>
<main id="settings-layout">
  <header id="settings-page-header">
    <a class="return-to-game" href="index.html">&larr; return to game</a>
    <div id="settings-heading">
      <h1>Settings</h1>
      <p>Changes save automatically.</p>
    </div>
  </header>
  <p id="settings-status" hidden></p>
  <div id="settings-column">
    <!-- groups and rows built by settings-page.js from SETTINGS_SCHEMA -->
  </div>
  <section class="settings-group" id="preferences-transfer">
    <h2 class="settings-group-heading" title="Preferences files do not include game history.">Preferences backup</h2>
    <div class="settings-group-body">
      <button type="button" id="preferences-export">Export preferences</button>
      <a id="preferences-download" hidden>Save preferences file</a>
      <form id="preferences-import-form">
        <label for="preferences-import-text">Import preferences JSON</label>
        <textarea id="preferences-import-text" rows="4"></textarea>
        <button type="submit">Apply preferences</button>
        <label>Open preferences file <input id="preferences-import-file" type="file" accept=".json,application/json"></label>
      </form>
    </div>
  </section>
  <footer id="settings-page-footer">
    <a class="return-to-game" href="index.html">&larr; return to game</a>
  </footer>
</main>
<script src="storage.js?v=20260921-all-preferences"></script>
<script src="generators.js?v=20260921-shared-settings"></script>
<script src="settings-core.js?v=20260921-visible-zero-one"></script>
<script src="settings-page.js?v=20260921-all-preferences"></script>
</body>
</html>
