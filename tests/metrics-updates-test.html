<!doctype html>
<meta charset="utf-8">
<title>Motion stats update regression</title>
<style>
  body { font: 14px monospace; }
  #results { height: 150px; overflow: auto; }
  iframe { width: 1400px; height: 650px; border: 1px solid #999; }
</style>
<h1>Motion stats update regression</h1>
<p>Run on http://127.0.0.1:8099/tests/metrics-updates-test.html.</p>
<pre id="results">Running…</pre>
<iframe src="../index.html" title="Minesweeper motion stats under test"></iframe>
<script>
'use strict';
const frame = document.querySelector('iframe');
frame.addEventListener('load', () => {
  const script = frame.contentDocument.createElement('script');
  script.textContent = `
'use strict';
(async () => {
  const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));
  const waitFor = async (condition) => {
    const deadline = performance.now() + 10000;
    while (!condition()) {
      if (performance.now() >= deadline) throw new Error('Timed out waiting for metrics update');
      await delay(50);
    }
  };
  const results = [];
  const check = (name, ok) => {
    results.push((ok ? 'PASS ' : 'FAIL ') + name);
    parent.document.getElementById('results').textContent = results.join('\\n');
  };
  await waitFor(() => settings !== null
    && !document.documentElement.classList.contains('game-booting'));
  // All setup is RAM-only. No games are finished, scores saved, or settings
  // persisted. The real capture handlers, scheduler, calculations, and DOM
  // renderer run inside the app's document.
  settings.panels.motionStats = true;
  gameState = 'ready';
  beginTrace();
  renderMotionStats();
  await waitFor(() => motionStatsView.rows.length > 0 && metricsUpdateFrame === null
    && metricsUpdateTimeout === null && boardLayoutFrame === null && !liveMetricsPending
    && [...analysisLanes.values()].every(lane => lane.pending.size === 0));
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const section = document.getElementById('motion-stats');
  const row = motionStatsView.rows[0];
  const spark = row.querySelector('svg');
  const line = spark.querySelector('path');
  let mutations = 0;
  let layoutCalls = 0;
  const observer = new MutationObserver(records => { mutations += records.length; });
  observer.observe(section, { subtree: true, childList: true, attributes: true, characterData: true });
  const originalLayout = syncBoardLayout;
  syncBoardLayout = () => { layoutCalls++; originalLayout(); };
  const idleSamples = metricsSeries.tMs.length;
  await delay(1300);
  check('ready board performs no idle stats writes or sampling',
    mutations === 0 && metricsSeries.tMs.length === idleSamples);
  check('ready board performs no periodic layout pass (' + layoutCalls + ')', layoutCalls === 0);
  layoutCalls = 0;

  for (let i = 0; i < 20; i++) {
    document.dispatchEvent(new MouseEvent('mousemove', { clientX: 700 + i, clientY: 150 }));
  }
  traceEvent('ldown', new MouseEvent('mousedown', { clientX: 720, clientY: 150 }), 0);
  traceEvent('lup', new MouseEvent('mouseup', { clientX: 720, clientY: 150 }), 0);
  await waitFor(() => lastLiveMetrics.bio.leftClickCount === 1);
  const clickRow = motionStatsView.rows.find(item =>
    item.querySelector('.metric-label').textContent === 'left clicks');
  check('captured input updates the displayed measurement',
    clickRow.querySelector('.metric-value').textContent === '1');
  check('live row, SVG, and path retain their DOM identity',
    motionStatsView.rows[0] === row && row.querySelector('svg') === spark
      && spark.querySelector('path') === line);
  check('live data does not invoke page layout', layoutCalls === 0);

  const beforeClock = metricsSeries.tMs.length;
  let inputComputations = 0;
  const originalCompute = computeTraceMetrics;
  computeTraceMetrics = (...args) => { inputComputations++; return originalCompute(...args); };
  gameState = 'playing';
  startTimer();
  await waitFor(() => metricsSeries.tMs.length > beforeClock);
  check('active game clock advances elapsed measurements without rescanning input',
    inputComputations === 0 && lastLiveMetrics.wallDurationMs > 0);
  clearInterval(timerInterval);
  timerInterval = null;
  gameState = 'lost';
  renderMotionStats();
  await delay(500);
  check('game end cancels pending metrics work',
    metricsUpdateFrame === null && metricsUpdateTimeout === null);
  mutations = 0;
  layoutCalls = 0;
  const endedSamples = metricsSeries.tMs.length;
  await delay(1300);
  check('finished game performs no idle stats writes, samples, or layout passes',
    mutations === 0 && metricsSeries.tMs.length === endedSamples && layoutCalls === 0);
  gameState = 'ready';
  beginTrace();
  await waitFor(() => lastLiveMetrics !== null);
  check('next game resets the measurement without replacing live rows',
    lastLiveMetrics.bio.leftClickCount === 0 && motionStatsView.rows[0] === row);
  settings.panels.motionStats = false;
  renderMotionStats();
  settings.panels.motionStats = true;
  renderMotionStats();
  check('reopening reuses the live rows', section.contains(row) && motionStatsView.rows[0] === row);
  observer.disconnect();
  syncBoardLayout = originalLayout;
  computeTraceMetrics = originalCompute;
  parent.document.getElementById('results').textContent += '\\nDONE';
})().catch(error => {
  parent.document.getElementById('results').textContent += '\\n' + error.stack;
});
`;
  frame.contentDocument.body.appendChild(script);
});
</script>
