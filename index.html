<!DOCTYPE html>
<html lang="en" class="game-booting">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minesweeper - Standard Mode</title>
<link rel="stylesheet" href="style.css?v=20260904-pocket-side">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!-- Defer preserves dependency order while letting every page asset download
     in parallel. Storage starts first so disk access overlaps JS startup. -->
<script defer src="storage.js"></script>
<script defer src="rng.js"></script>
<script defer src="justice.js?v=20260825-batched-certification"></script>
<script defer src="board-shape.js"></script>
<script defer src="zini.js"></script>
<script defer src="endgame.js"></script>
<script defer src="solver.js?v=20260823-exact-solver"></script>
<script defer src="generators.js?v=20260825-noise-family"></script>
<script defer src="pregen.js?v=20260826-pregen-highlight"></script>
<script defer src="odds.js?v=20260825-batched-certification"></script>
<script defer src="trial.js"></script>
<script defer src="settings-core.js?v=20260904-pocket-side"></script>
<script defer src="minesweeper.js?v=20260904-pocket-side"></script>
</head>
<body aria-busy="true">
<div id="top-right">
  <div id="play-mode">
    <label>Mode
      <select id="play-mode-select" disabled>
        <option>Loading saved mode…</option>
      </select>
    </label>
    <div id="trial-progress" hidden></div>
    <div id="pregen-progress" hidden></div>
    <div id="endgame-drill-info" hidden></div>
  </div>
  <div id="board-generator">
    <label>Generator
      <select id="board-generator-select" disabled>
        <option>Loading saved generator…</option>
      </select>
    </label>
  </div>
  <div id="music-indicator" hidden title="This machine is playing audio right now (rechecked about once a minute). Stamped onto each finished game as its music state.">music</div>
  <div id="states">
    <div id="states-chips"></div>
    <button type="button" id="states-add-btn" title="Tag your play session (sleepy? new mouse?). Active states are saved onto every game you finish so you can compare measurements by self-reported context; a tag does not establish a cause.">+ state</button>
    <div id="states-menu" hidden>
      <div id="states-menu-head">
        <span>session states</span>
        <button type="button" id="states-close" title="close (Esc or a click outside also closes)">&times;</button>
      </div>
      <div id="states-options"></div>
      <form id="states-add-form">
        <input id="states-add-input" type="text" placeholder="new state">
        <button type="submit">add</button>
      </form>
      <p id="states-status"></p>
    </div>
  </div>
  <a id="settings-btn" href="settings.html">settings</a>
</div>
<div id="page-layout">
<div id="metrics-panel" hidden><div id="metrics-panel-content"></div></div>
<main>
  <nav id="difficulty-tabs">
    <a href="#" data-difficulty="beginner" class="active">Beginner</a>
    <a href="#" data-difficulty="intermediate">Intermediate</a>
    <a href="#" data-difficulty="expert">Expert</a>
    <a href="#" data-difficulty="custom">Custom</a>
    <label id="zoom-label">Zoom
      <select id="zoom-select">
        <option value="16">16</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="28" selected>28</option>
        <option value="32">32</option>
      </select>
    </label>
    <button type="button" id="board-position-btn" aria-expanded="false"
      aria-controls="board-position-panel">position</button>
    <div id="board-position-panel" hidden>
      <div class="board-position-row">
        <label for="board-position-x">left / right</label>
        <div class="board-position-slider">
          <input id="board-position-x" type="range" min="-2000" max="2000" step="1">
          <div class="board-position-ticks" aria-hidden="true">
            <span>-2000</span><span>-1000</span><span>0</span><span>1000</span><span>2000</span>
          </div>
        </div>
        <input id="board-position-x-number" type="number" min="-2000" max="2000" step="1"
          aria-label="Horizontal board offset in pixels">
      </div>
      <div class="board-position-row">
        <label for="board-position-y">up / down</label>
        <div class="board-position-slider">
          <input id="board-position-y" type="range" min="-1000" max="2000" step="1">
          <div class="board-position-ticks" aria-hidden="true">
            <span>-1000</span><span>-250</span><span>500</span><span>1250</span><span>2000</span>
          </div>
        </div>
        <input id="board-position-y-number" type="number" min="-1000" max="2000" step="1"
          aria-label="Vertical board offset in pixels">
      </div>
      <p id="board-position-note">Drag the highlighted board, or use its arrow keys. Shift moves 10 px.</p>
      <div id="board-position-actions">
        <button type="button" id="board-position-reset">center</button>
        <button type="button" id="board-position-done">done</button>
      </div>
    </div>
  </nav>
  <form id="custom-form" hidden>
    <label>Width <input id="custom-width" type="number" min="8" max="100" value="30"></label>
    <label>Height <input id="custom-height" type="number" min="1" max="100" value="16"></label>
    <label>Mines <input id="custom-mines" type="number" min="1" value="99"></label>
    <button type="submit">Update</button>
  </form>
  <div id="board-lab-panel" hidden></div>

  <div id="game-area">
    <div id="startup-status" role="status">
      <span class="startup-dot" aria-hidden="true"></span>
      Loading your settings and saved history…
    </div>
    <div id="trial-stage" hidden>
      <p id="trial-copy"></p>
      <p id="trial-verdict" hidden></p>
      <button type="button" id="trial-start-btn">start trial</button>
    </div>
    <div id="game-frame">
      <div id="top-panel">
        <div id="mine-counter" class="lcd"></div>
        <button id="face-button" type="button" aria-label="New game" disabled>
          <svg viewBox="0 0 26 26" aria-hidden="true">
            <path d="M6 9.5 Q6.5 5.8 10.5 6.3 Q14.5 6.8 16.5 9 Q20.5 10.5 24 9.5 L21.5 12 L23.5 14.5 Q17.5 18.5 12 17.5 Q7 16.5 6 12 Q5.6 10.6 6 9.5 Z" fill="#ffffff" stroke="#000" stroke-width="1.1"/>
            <path d="M10.5 10.5 Q14.5 8.5 17.5 10 Q14.5 13.5 10.5 10.5 Z" fill="#dddddd" stroke="#000" stroke-width="0.9"/>
            <circle cx="8.7" cy="8.8" r="0.75"/>
            <path d="M6.2 8.8 L3 10 L6.2 11.2 Z" fill="#f0a020"/>
          </svg>
        </button>
        <div id="timer" class="lcd"></div>
      </div>
      <div id="board" aria-busy="true" aria-describedby="startup-status"></div>
      <script>
        // Real covered cells give first paint the exact game geometry. The
        // loaded game replaces them in place; they never pretend to be ready.
        (() => {
          const board = document.getElementById('board');
          const fragment = document.createDocumentFragment();
          for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell hidden startup-cell';
            cell.setAttribute('aria-hidden', 'true');
            fragment.appendChild(cell);
          }
          board.appendChild(fragment);
        })();
      </script>
    </div>
    <div id="board-position-drag-surface" hidden tabindex="0"
      aria-label="Board position. Drag, or use arrow keys to move."></div>

    <!-- The after-game controls: always the game-history slider first (it
         is shown for every finished game, no toggle), then its board
         overlays, then the path colors, then the scores button. This block
         stays in the main column beneath the board: it cancels the board's
         player-chosen sideways translation, so it can never sit under the
         metrics sidebar. -->
    <nav id="scores-nav" aria-label="Inspect the finished game or view high scores">
      <span id="replay-controls" hidden aria-label="Game history: actions done">
        <button type="button" id="replay-prev" aria-label="One action back">‹</button>
        <span id="replay-slider-wrap">
          <span id="replay-slider-value" aria-hidden="true"></span>
          <input type="range" id="replay-slider" min="0" max="0" step="1" value="0"
            aria-label="Game history position (actions done)">
          <span id="replay-slider-scale" aria-hidden="true"></span>
        </span>
        <button type="button" id="replay-next" aria-label="One action forward">›</button>
        <span id="replay-status" aria-live="polite"></span>
      </span>
      <div id="replay-overlay-control" hidden aria-label="Board overlays while stepping through the game">
        <span class="path-view-heading">overlays</span>
        <button type="button" data-replay-overlay="moves">available moves</button>
        <button type="button" data-replay-overlay="mines">forced mines</button>
        <button type="button" data-replay-overlay="probs">mine&nbsp;%</button>
        <button type="button" data-replay-overlay="pointless">pointless clicks</button>
        <button type="button" data-replay-overlay="purposeful">purposeful clicks</button>
        <button type="button" data-replay-overlay="movement">rough movement</button>
      </div>
      <div id="path-view-control" hidden aria-label="Path overlay">
        <span class="path-view-heading">path</span>
        <button type="button" data-path-view="off">off</button>
        <button type="button" data-path-view="raw-path">raw path</button>
        <button type="button" data-path-view="click-locations">click locations</button>
        <button type="button" data-path-view="movement-speed">movement speed</button>
        <button type="button" data-path-view="click-speed">click speed</button>
        <button type="button" data-path-view="progress">game progress</button>
        <button type="button" data-path-view="less-useful">less useful</button>
      </div>
      <button type="button" id="see-scores-btn">see scores</button>
    </nav>
    <!-- Vertical key beside the board's right edge when the gutter allows
         (positioned by syncResultsPlacement), otherwise in flow here. -->
    <div id="path-view-legend" hidden></div>

    <div id="results">
      <p id="result-summary"></p>
      <div id="result-stats"></div>
    </div>
    <div id="justice-live" aria-live="polite" aria-label="Justice events"></div>
  </div>

  <section id="pregen-charts" hidden aria-label="Pregen challenge charts"></section>
  <section id="result-analysis" aria-label="After-game action analysis"></section>
  <div id="result-ranks"></div>

  <div id="backup">
    <button type="button" id="export-btn">export history</button>
    <a id="export-file" hidden>save to file</a>
    <button type="button" id="export-traces-btn">export traces</button>
    <a id="export-traces-file" hidden>save traces to file</a>
    <button type="button" id="import-btn">import history</button>
    <button type="button" id="format-btn">data format</button>
    <span id="backup-status"></span>
    <div id="import-panel" hidden>
      <textarea id="import-text" rows="3" placeholder="paste exported JSON here"></textarea>
      <button type="button" id="import-apply">apply</button>
      <button type="button" id="import-open">open file&hellip;</button>
      <input type="file" id="import-file-input" accept=".json,application/json" hidden>
    </div>
    <div id="format-panel" hidden></div>
  </div>

  <p id="site-footer"><a href="https://github.com/ernop/minesweeper-friendly">source &amp; issues on GitHub</a></p>

</main>
</div>
</body>
</html>
