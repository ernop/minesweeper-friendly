<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minesweeper - Standard Mode</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="top-right">
  <div id="play-mode">
    <label>Mode
      <select id="play-mode-select"></select>
    </label>
    <div id="trial-progress" hidden></div>
  </div>
  <div id="music-indicator" hidden title="This machine is playing audio right now (rechecked about once a minute). Stamped onto each finished game as its music state.">music</div>
  <div id="states">
    <div id="states-chips"></div>
    <button type="button" id="states-add-btn" title="Tag your play session (sleepy? new mouse?). Active states are saved onto every game you finish, so you can see how life affects your play.">+ state</button>
    <div id="states-menu" hidden>
      <div id="states-options"></div>
      <form id="states-add-form">
        <input id="states-add-input" type="text" placeholder="new state">
        <button type="submit">add</button>
      </form>
      <p id="states-status"></p>
    </div>
  </div>
  <button type="button" id="settings-btn">settings</button>
  <div id="settings-panel" hidden></div>
</div>
<main>
  <nav id="difficulty-tabs">
    <a href="#" data-difficulty="beginner" class="active">Beginner</a>
    <a href="#" data-difficulty="intermediate">Intermediate</a>
    <a href="#" data-difficulty="expert">Expert</a>
    <a href="#" data-difficulty="custom">Custom</a>
    <label id="zoom-label">Zoom
      <select id="zoom-select">
        <option value="16">16</option>
        <option value="20">20</option>
        <option value="24" selected>24</option>
        <option value="28">28</option>
        <option value="32">32</option>
      </select>
    </label>
  </nav>
  <nav id="scores-nav" aria-label="View high scores without playing">
    <span>view scores</span>
    <button type="button" data-score-difficulty="beginner">Beginner</button>
    <button type="button" data-score-difficulty="intermediate">Intermediate</button>
    <button type="button" data-score-difficulty="expert">Expert</button>
  </nav>

  <form id="custom-form" hidden>
    <label>Width <input id="custom-width" type="number" min="8" max="100" value="30"></label>
    <label>Height <input id="custom-height" type="number" min="1" max="100" value="16"></label>
    <label>Mines <input id="custom-mines" type="number" min="1" value="99"></label>
    <button type="submit">Update</button>
  </form>

  <div id="game-area">
    <div id="trial-stage" hidden>
      <p id="trial-copy"></p>
      <p id="trial-verdict" hidden></p>
      <button type="button" id="trial-start-btn">start trial</button>
    </div>
    <div id="game-frame">
      <div id="top-panel">
        <div id="mine-counter" class="lcd"></div>
        <button id="face-button" type="button" aria-label="New game"></button>
        <div id="timer" class="lcd"></div>
      </div>
      <div id="board"></div>
    </div>

    <div id="results">
      <p id="result-summary"></p>
      <div id="result-stats"></div>
    </div>
    <div id="justice-live" aria-live="polite" aria-label="Justice events"></div>
  </div>

  <div id="result-ranks"></div>

  <div id="backup">
    <button type="button" id="export-btn">export history</button>
    <a id="export-file" hidden>save to file</a>
    <button type="button" id="export-traces-btn">export traces</button>
    <a id="export-traces-file" hidden>save traces to file</a>
    <button type="button" id="import-btn">import history</button>
    <button type="button" id="format-btn">data format</button>
    <span id="backup-status"></span>
    <div id="import-panel" hidden>
      <textarea id="import-text" rows="3" placeholder="paste exported JSON here"></textarea>
      <button type="button" id="import-apply">apply</button>
      <button type="button" id="import-open">open file&hellip;</button>
      <input type="file" id="import-file-input" accept=".json,application/json" hidden>
    </div>
    <div id="format-panel" hidden></div>
  </div>

  <p id="site-footer"><a href="https://github.com/ernop/minesweeper-friendly">source &amp; issues on GitHub</a></p>

  <div id="metrics-panel" hidden></div>
</main>
<script src="rng.js"></script>
<script src="justice.js"></script>
<script src="board-shape.js"></script>
<script src="solver.js"></script>
<script src="odds.js"></script>
<script src="trial.js"></script>
<script src="minesweeper.js"></script>
</body>
</html>
