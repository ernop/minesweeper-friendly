<body aria-busy="true">
<div id="page-layout">
<div id="top-bar">
  <span id="play-limits-use" hidden></span>
  <a id="settings-btn" class="ui-button" href="settings.html">settings</a>
</div>
<main>
  <nav id="difficulty-tabs" aria-label="Board and mode">
    <button type="button" id="game-sidebar-button" class="ui-button" popovertarget="game-sidebar" hidden>Game details</button>
    <a href="#" data-difficulty="beginner" class="active">Beginner</a>
    <a href="#" data-difficulty="intermediate">Intermediate</a>
    <a href="#" data-difficulty="expert">Expert</a>
    <select id="play-mode-select" class="ui-select" aria-label="other modes" disabled>
      <option>Loading saved mode…</option>
    </select>
  </nav>
  <div id="mode-options" hidden>
    <form id="custom-form">
      <label>Width <input id="custom-width" type="number" min="8" max="100" value="30"></label>
      <label>Height <input id="custom-height" type="number" min="1" max="100" value="16"></label>
      <label>Mines <input id="custom-mines" type="number" min="1" value="99"></label>
      <button type="submit" class="ui-button">Update</button>
    </form>
    <label id="board-generator">Generator
      <select id="board-generator-select" class="ui-select"></select>
    </label>
    <span id="trial-progress" hidden></span>
    <span id="pregen-progress" hidden></span>
    <span id="endgame-drill-info" hidden></span>
  </div>
  <div id="board-lab-panel" hidden></div>

  <div id="game-area">
    <div id="startup-status" role="status">
      <span class="startup-dot" aria-hidden="true"></span>
      Preparing your game…
    </div>
    <div id="trial-stage" hidden>
      <p id="trial-copy"></p>
      <p id="trial-verdict" hidden></p>
      <button type="button" id="trial-start-btn">start trial</button>
    </div>
    <div id="game-frame">
      <div id="top-panel">
        <div id="mine-counter" class="lcd"></div>
        <button id="face-button" type="button" aria-label="New game" disabled>
          <svg viewBox="0 0 26 26" aria-hidden="true">
            <path d="M6 9.5 Q6.5 5.8 10.5 6.3 Q14.5 6.8 16.5 9 Q20.5 10.5 24 9.5 L21.5 12 L23.5 14.5 Q17.5 18.5 12 17.5 Q7 16.5 6 12 Q5.6 10.6 6 9.5 Z" fill="#ffffff" stroke="#000" stroke-width="1.1"/>
            <path d="M10.5 10.5 Q14.5 8.5 17.5 10 Q14.5 13.5 10.5 10.5 Z" fill="#dddddd" stroke="#000" stroke-width="0.9"/>
            <circle cx="8.7" cy="8.8" r="0.75"/>
            <path d="M6.2 8.8 L3 10 L6.2 11.2 Z" fill="#f0a020"/>
          </svg>
        </button>
        <div id="timer" class="lcd"></div>
      </div>
      <div id="board" aria-busy="true" aria-describedby="startup-status"></div>
      <div id="play-limit-closed" role="status" hidden></div>
    </div>
    <div id="replay-controls" hidden aria-label="Replay of the finished game">
      <span id="replay-slider-wrap">
        <span id="replay-slider-value" aria-hidden="true"></span>
        <input type="range" id="replay-slider" min="0" max="0" step="1" value="0"
          aria-label="Game history position (actions done)">
        <span id="replay-slider-scale" aria-hidden="true"></span>
      </span>
      <button type="button" id="replay-first" aria-label="Start" title="Start">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1h1.6v8H1zM9 1 3 5l6 4z"/></svg>
      </button>
      <button type="button" id="replay-prev" aria-label="One action back" title="One action back">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M7 1 3 5l4 4" class="replay-chevron"/></svg>
      </button>
      <button type="button" id="replay-play" aria-label="Play" title="Play at the pace it was played">
        <svg class="replay-play-icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>
        <svg class="replay-pause-icon" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1h2.4v8H2zM5.6 1H8v8H5.6z"/></svg>
      </button>
      <button type="button" id="replay-next" aria-label="One action forward" title="One action forward">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1l4 4-4 4" class="replay-chevron"/></svg>
      </button>
      <button type="button" id="replay-last" aria-label="End: the finished board" title="End: the finished board">
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 1l6 4-6 4zM7.4 1H9v8H7.4z"/></svg>
      </button>
      <span id="replay-status" aria-live="polite"></span>
      <div id="replay-overlay-control" role="group" aria-label="Board overlays while stepping through the game">
        <span class="path-view-heading">Board overlays</span>
        <button type="button" data-replay-overlay="moves">available moves</button>
        <button type="button" data-replay-overlay="mines">forced mines</button>
        <button type="button" data-replay-overlay="probs">mine&nbsp;%</button>
        <button type="button" data-replay-overlay="pointless">pointless clicks</button>
        <button type="button" data-replay-overlay="purposeful">purposeful clicks</button>
        <button type="button" data-replay-overlay="movement">rough movement</button>
      </div>
      <div id="path-view-control" role="group" aria-label="Mouse path, one view at a time">
        <span class="path-view-heading">Mouse path</span>
        <button type="button" data-path-view="raw-path">raw path</button>
        <button type="button" data-path-view="click-locations">click locations</button>
        <button type="button" data-path-view="movement-speed">movement speed</button>
        <button type="button" data-path-view="click-speed">click speed</button>
        <button type="button" data-path-view="progress">game progress</button>
        <button type="button" data-path-view="less-useful">less useful</button>
      </div>
    </div>
    <div id="board-position-drag-surface" hidden tabindex="0"
      aria-label="Board position. Drag, or use arrow keys to move."></div>

    <div id="justice-live" aria-live="polite" aria-label="A Just Universe"></div>
  </div>

  <section id="pregen-charts" hidden aria-label="Pregen challenge charts"></section>
  <section id="result-analysis" aria-label="After-game action analysis"></section>
  <div id="result-ranks"></div>
  <div id="motion-stats"></div>

  <div id="backup">
    <button type="button" id="export-btn" class="ui-button">export history</button>
    <a id="export-file" class="ui-button" hidden>save to file</a>
    <button type="button" id="export-traces-btn" class="ui-button">export traces</button>
    <a id="export-traces-file" class="ui-button" hidden>save traces to file</a>
    <button type="button" id="import-btn" class="ui-button" aria-expanded="false" aria-controls="import-panel">import history</button>
    <button type="button" id="format-btn" class="ui-button" aria-expanded="false" aria-controls="format-panel">data format</button>
    <span id="backup-status"></span>
    <div id="import-panel" hidden>
      <textarea id="import-text" rows="3" placeholder="paste exported JSON here"></textarea>
      <button type="button" id="import-apply" class="ui-button">apply</button>
      <button type="button" id="import-open" class="ui-button">open file&hellip;</button>
      <input type="file" id="import-file-input" accept=".json,application/json" hidden>
    </div>
    <div id="format-panel" hidden></div>
  </div>

  <div id="settings-row" role="group" aria-label="Your settings">
    <span class="settings-row-group">
      <a id="play-limits-btn" class="ui-button" href="settings.html#play-limits"
        title="Daily limits on play time, games, and a stop time, and what reaching one does (by default, no new flags for half the limit again, then no new boards), set on the settings page">daily limits</a>
    </span>
    <label id="session-picker" class="settings-row-group">session
      <select id="session-definition-select" class="ui-select" aria-label="session" disabled>
        <option>Loading saved session…</option>
      </select>
    </label>
    <span id="board-display" class="settings-row-group" role="group" aria-label="Board display">
      <label id="zoom-label">Zoom
        <select id="zoom-select" class="ui-select" disabled></select>
      </label>
      <button type="button" id="board-position-btn" class="ui-button" aria-expanded="false"
        aria-controls="board-position-panel">position</button>
      <span id="pixel-ratio"
        title="Screen pixels per page pixel: the browser zoom times the system display scale, which a page cannot read separately, so it changes whenever the browser zoom does.">pixel ratio <span id="pixel-ratio-value"></span></span>
    </span>
  </div>

  <p id="site-footer">
    <a href="self-check.html" title="Sleepiness rating plus a 30-second alertness test, saved for comparison over years">self-check</a>
    &middot; <a href="training.html">training</a>
    &middot; <a href="problems.html" title="Real moments from strong players' games: open what a new number proves, timed">problems</a>
    &middot; <a href="https://minesweeper-friendly.fuseki.net/">play on Fuseki</a>
  </p>

</main>
<div id="details-resize" role="separator" aria-orientation="vertical" aria-label="resize details column" title="drag to resize the details column" tabindex="0" hidden></div>
<aside id="game-sidebar" aria-label="Play context, game statistics, and replay legend">
  <button type="button" id="game-sidebar-close" class="ui-button" popovertarget="game-sidebar" popovertargetaction="hide" hidden>Close</button>
  <p id="result-summary"></p>
  <!-- The play context and see scores pack into small wrapping rows, so the
       stat sections below get the column's height. -->
  <div id="sidebar-controls">
    <div id="top-right">
      <button type="button" id="archive-chip" class="ui-button alert" hidden></button>
      <div id="states">
        <p id="play-context"><span id="music-state" class="context-item" hidden></span></p>
        <button type="button" id="states-edit-btn" class="ui-button" aria-expanded="false" aria-controls="states-menu"
          title="Tag your play session (sleepy? new mouse?). The states you have on are saved onto every game you finish, so measurements can be compared by self-reported context; a tag does not establish a cause.">edit states</button>
        <div id="states-menu" hidden>
          <div id="states-menu-head">
            <span>session states</span>
            <button type="button" id="states-close" title="close (Esc or a click outside also closes)">&times;</button>
          </div>
          <div id="states-options"></div>
          <form id="states-add-form">
            <input id="states-add-input" type="text" placeholder="new state" aria-label="new state">
            <button type="submit" class="ui-button">add</button>
          </form>
          <p id="states-status"></p>
        </div>
      </div>
    </div>
    <nav id="scores-nav" aria-label="High scores">
      <button type="button" id="see-scores-btn" class="ui-button">see scores</button>
    </nav>
  </div>
  <div id="results" hidden>
    <div id="result-stats"></div>
  </div>
  <div id="path-view-legend" hidden></div>
</aside>
</div>
<div id="board-position-panel" role="region" aria-labelledby="board-position-title" hidden>
  <div id="board-position-actions">
    <strong id="board-position-title">Board position</strong>
    <button type="button" id="board-position-reset">Reset</button>
    <button type="button" id="board-position-done">Done</button>
  </div>
  <div class="board-position-row">
    <label for="board-position-x">left / right</label>
    <div class="board-position-slider">
      <input id="board-position-x" type="range" min="-2000" max="2000" step="1">
      <div class="board-position-ticks" aria-hidden="true">
        <span>-2000</span><span>-1000</span><span>0</span><span>1000</span><span>2000</span>
      </div>
    </div>
    <input id="board-position-x-number" type="number" min="-2000" max="2000" step="1"
      aria-label="Horizontal board offset in pixels">
  </div>
  <div class="board-position-row">
    <label for="board-position-y">up / down</label>
    <div class="board-position-slider">
      <input id="board-position-y" type="range" min="-1000" max="2000" step="1">
      <div class="board-position-ticks" aria-hidden="true">
        <span>-1000</span><span>-250</span><span>500</span><span>1250</span><span>2000</span>
      </div>
    </div>
    <input id="board-position-y-number" type="number" min="-1000" max="2000" step="1"
      aria-label="Vertical board offset in pixels">
  </div>
</div>
</body>
</html>
