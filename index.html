<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minesweeper - Standard Mode</title>
<link rel="stylesheet" href="style.css?v=20260826-board-position">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
<div id="top-right">
  <div id="play-mode">
    <label>Mode
      <select id="play-mode-select"></select>
    </label>
    <div id="trial-progress" hidden></div>
    <div id="pregen-progress" hidden></div>
  </div>
  <div id="board-generator">
    <label>Generator
      <select id="board-generator-select"></select>
    </label>
  </div>
  <div id="music-indicator" hidden title="This machine is playing audio right now (rechecked about once a minute). Stamped onto each finished game as its music state.">music</div>
  <div id="states">
    <div id="states-chips"></div>
    <button type="button" id="states-add-btn" title="Tag your play session (sleepy? new mouse?). Active states are saved onto every game you finish so you can compare measurements by self-reported context; a tag does not establish a cause.">+ state</button>
    <div id="states-menu" hidden>
      <div id="states-menu-head">
        <span>session states</span>
        <button type="button" id="states-close" title="close (Esc or a click outside also closes)">&times;</button>
      </div>
      <div id="states-options"></div>
      <form id="states-add-form">
        <input id="states-add-input" type="text" placeholder="new state">
        <button type="submit">add</button>
      </form>
      <p id="states-status"></p>
    </div>
  </div>
  <a id="settings-btn" href="settings.html">settings</a>
</div>
<div id="page-layout">
<div id="metrics-panel" hidden><div id="metrics-panel-content"></div></div>
<main>
  <nav id="difficulty-tabs">
    <a href="#" data-difficulty="beginner" class="active">Beginner</a>
    <a href="#" data-difficulty="intermediate">Intermediate</a>
    <a href="#" data-difficulty="expert">Expert</a>
    <a href="#" data-difficulty="custom">Custom</a>
    <label id="zoom-label">Zoom
      <select id="zoom-select">
        <option value="16">16</option>
        <option value="20">20</option>
        <option value="24">24</option>
        <option value="28" selected>28</option>
        <option value="32">32</option>
      </select>
    </label>
    <button type="button" id="board-position-btn" aria-expanded="false"
      aria-controls="board-position-panel">position</button>
    <div id="board-position-panel" hidden>
      <div class="board-position-row">
        <label for="board-position-x">left / right</label>
        <input id="board-position-x" type="range" min="-2000" max="2000" step="1">
        <input id="board-position-x-number" type="number" min="-2000" max="2000" step="1"
          aria-label="Horizontal board offset in pixels">
      </div>
      <div class="board-position-row">
        <label for="board-position-y">up / down</label>
        <input id="board-position-y" type="range" min="-1000" max="2000" step="1">
        <input id="board-position-y-number" type="number" min="-1000" max="2000" step="1"
          aria-label="Vertical board offset in pixels">
      </div>
      <p id="board-position-note">Drag the highlighted board, or use its arrow keys. Shift moves 10 px.</p>
      <div id="board-position-actions">
        <button type="button" id="board-position-reset">center</button>
        <button type="button" id="board-position-done">done</button>
      </div>
    </div>
  </nav>
  <form id="custom-form" hidden>
    <label>Width <input id="custom-width" type="number" min="8" max="100" value="30"></label>
    <label>Height <input id="custom-height" type="number" min="1" max="100" value="16"></label>
    <label>Mines <input id="custom-mines" type="number" min="1" value="99"></label>
    <button type="submit">Update</button>
  </form>
  <div id="board-lab-panel" hidden></div>

  <div id="game-area">
    <div id="trial-stage" hidden>
      <p id="trial-copy"></p>
      <p id="trial-verdict" hidden></p>
      <button type="button" id="trial-start-btn">start trial</button>
    </div>
    <div id="game-frame">
      <div id="top-panel">
        <div id="mine-counter" class="lcd"></div>
        <button id="face-button" type="button" aria-label="New game"></button>
        <div id="timer" class="lcd"></div>
      </div>
      <div id="board"></div>
    </div>
    <div id="board-position-drag-surface" hidden tabindex="0"
      aria-label="Board position. Drag, or use arrow keys to move."></div>

    <nav id="scores-nav" aria-label="View high scores or the finished game's cursor path">
      <button type="button" id="see-scores-btn">see scores</button>
      <button type="button" id="path-view-btn" hidden title="Draw the finished game's actual cursor path over the board. 'moves' is every recorded movement; 'clicks' connects only the clicks in order. Light = earlier, dark = later; blue dots are left clicks, red dots are flag clicks. Movement off the board clips at its edge.">path: off</button>
    </nav>

    <div id="results">
      <p id="result-summary"></p>
      <div id="result-stats"></div>
    </div>
    <div id="justice-live" aria-live="polite" aria-label="Justice events"></div>
  </div>

  <section id="pregen-charts" hidden aria-label="Pregen challenge charts"></section>
  <section id="result-analysis" aria-label="After-game action analysis"></section>
  <div id="result-ranks"></div>

  <div id="backup">
    <button type="button" id="export-btn">export history</button>
    <a id="export-file" hidden>save to file</a>
    <button type="button" id="export-traces-btn">export traces</button>
    <a id="export-traces-file" hidden>save traces to file</a>
    <button type="button" id="import-btn">import history</button>
    <button type="button" id="format-btn">data format</button>
    <span id="backup-status"></span>
    <div id="import-panel" hidden>
      <textarea id="import-text" rows="3" placeholder="paste exported JSON here"></textarea>
      <button type="button" id="import-apply">apply</button>
      <button type="button" id="import-open">open file&hellip;</button>
      <input type="file" id="import-file-input" accept=".json,application/json" hidden>
    </div>
    <div id="format-panel" hidden></div>
  </div>

  <p id="site-footer"><a href="https://github.com/ernop/minesweeper-friendly">source &amp; issues on GitHub</a></p>

</main>
</div>
<script src="rng.js"></script>
<script src="justice.js?v=20260825-batched-certification"></script>
<script src="board-shape.js"></script>
<script src="solver.js?v=20260823-exact-solver"></script>
<script src="generators.js?v=20260825-noise-family"></script>
<script src="pregen.js?v=20260826-pregen-highlight"></script>
<script src="odds.js?v=20260825-batched-certification"></script>
<script src="trial.js"></script>
<script src="storage.js?v=20260823-simple-settings"></script>
<script src="settings-core.js?v=20260826-board-position"></script>
<script src="minesweeper.js?v=20260826-board-position"></script>
</body>
</html>
